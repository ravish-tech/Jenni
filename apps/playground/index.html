<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Jenni (pronounced 'yenni') — a web UI framework driven by beauty, simplicity, and performance. Built in loving memory of Jenni." />
    <title>Jenni — Design Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235548b8'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Apply saved theme + knobs before first paint (no flash).
      try {
        var p = JSON.parse(localStorage.getItem('jenni.playground.v2') || '{}');
        if (p.theme && p.theme !== 'system') document.documentElement.setAttribute('data-theme', p.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
