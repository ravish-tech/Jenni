name: Publish Packages to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build all packages
        run: |
          npm run typecheck
          npm run build:packages

      - name: Publish @jenni/core, @jenni/vue, and @jenni/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish -w @jenni/core --provenance --access public
          npm publish -w @jenni/vue --provenance --access public
          npm publish -w @jenni/react --provenance --access public
